<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - TV</title>
</head>

<body>
    <main class="login">
        <h1>Entrar</h1>
        <form id="login-form">
            <label for="username">Usuário</label>
            <input id="username" name="username" autocomplete="username" required>

            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <p id="login-error" role="alert" hidden>Usuário ou senha incorretos.</p>
            <button type="submit">Entrar</button>
        </form>
    </main>

    <script>
        const form = document.querySelector("#login-form");
        const errorMessage = document.querySelector("#login-error");

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const username = document.querySelector("#username").value;
            const password = document.querySelector("#password").value;

            // Credenciais de demonstração; não oferecem segurança real.
            if (username === "admin" && password === "tv123") {
                sessionStorage.setItem("tv_demo_logged_in", "true");
                window.location.href = "index.html";
                return;
            }

            errorMessage.hidden = false;
        });
    </script>
</body>

</html>
